<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Files</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
body { background:#343541; display:flex; justify-content:center; align-items:center; height:100vh;}
.chat-wrapper { width:100%; max-width:800px; background:#444654; border-radius:10px; overflow:hidden;}
.header { background:#202123; padding:16px; color:white; text-align:center;}
.form-container { padding:20px; display:flex; flex-direction:column;}

table {
    width:100%;
    border-collapse:collapse;
    color:white;
}

th, td {
    padding:12px;
    text-align:left;
    border-bottom:1px solid #565869;
}

th {
    background:#202123;
}

tr:hover {
    background:#565869;
}

button {
    padding:8px 12px;
    border-radius:6px;
    border:none;
    background:#19c37d;
    cursor:pointer;
    font-size:12px;
}

.secondary-btn {
    margin-top:15px;
    background:#565869;
    color:white;
}

.response {
    margin-top:10px;
    padding:10px;
    border-radius:8px;
}

.error {
    background:#565869;
    color:white;
}
</style>
</head>

<body>

<div class="chat-wrapper">
    <div class="header">My Files</div>

    <div class="form-container">
        <div id="tableContainer"></div>

        <button class="secondary-btn" onclick="window.location.href='/chat_page'">Back to Chat</button>

        <div id="response" class="response" style="display:none;"></div>
    </div>
</div>

<script>

// ✅ Get user_id from session
const userId = sessionStorage.getItem("user_id");

// ❌ Redirect if not logged in
if (!userId) {
    window.location.href = "/login";
}

// Load files
window.onload = fetchFiles;

async function fetchFiles() {
    const tableContainer = document.getElementById("tableContainer");
    const responseDiv = document.getElementById("response");

    try {
        const res = await fetch(`/api/get_files/${parseInt(userId)}`);
        const result = await res.json();

        if (res.status !== 200) {
            throw new Error(result.message || "Failed to fetch files");
        }

        const files = result.data;

        if (!files || files.length === 0) {
            tableContainer.innerHTML = "<p style='color:white;'>No files found.</p>";
            return;
        }

        // ✅ Create table
        tableContainer.innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>File ID</th>
                        <th>Uploaded Time</th>
                        <th>Ask GPT</th>
                    </tr>
                </thead>
                <tbody>
                    ${files.map(file => `
                        <tr>
                            <td>${file.display_file_name}</td>
                            <td>${file.file_id}</td>
                            <td>${file.upload_ts}</td>
                            <td>
                                <button onclick="askGPT(${file.file_id}, '${file.display_file_name}')">
                                    Ask GPT
                                </button>
                            </td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        `;

    } catch (err) {
        responseDiv.style.display = "block";
        responseDiv.className = "response error";
        responseDiv.innerText = err.message || "Server error";
    }
}

// ✅ Button action (you can modify later)
function askGPT(fileId, fileName) {
    console.log("Ask GPT clicked:", fileId, fileName);

    // Example: redirect to chat page with file_id
    window.location.href = `/chat_page?file_id=${fileId}`;
}

</script>

</body>
</html>
