<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload File</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
body { background:#343541; display:flex; justify-content:center; align-items:center; height:100vh;}
.chat-wrapper { width:100%; max-width:500px; background:#444654; border-radius:10px; overflow:hidden;}
.header { background:#202123; padding:16px; color:white; text-align:center;}
.form-container { padding:25px; display:flex; flex-direction:column;}
input { padding:14px; margin-bottom:15px; border-radius:8px; border:none; background:#565869; color:white;}
button { padding:14px; border-radius:8px; border:none; background:#19c37d; cursor:pointer;}
.secondary-btn { margin-top:10px; background:#565869; color:white;}
.response { margin-top:15px; padding:12px; border-radius:8px;}
.success { background:#19c37d; color:black;}
.error { background:#565869; color:white;}
</style>
</head>

<body>

<div class="chat-wrapper">
    <div class="header">Upload File</div>

    <div class="form-container">
        <input type="file" id="fileInput" />

        <button id="uploadBtn" onclick="uploadFile()">Upload</button>
        <button class="secondary-btn" onclick="window.location.href='/get_file'">Back to Dashboard</button>

        <div id="response" class="response" style="display:none;"></div>
    </div>
</div>

<script>

// ✅ Get user_id from session
const userId = sessionStorage.getItem("user_id");

// ❌ If not logged in → redirect
if (!userId) {
    window.location.href = "/login";
}

async function uploadFile() {
    const fileInput = document.getElementById("fileInput");
    const button = document.getElementById("uploadBtn");
    const responseDiv = document.getElementById("response");

    if (fileInput.files.length === 0) {
        responseDiv.style.display = "block";
        responseDiv.className = "response error";
        responseDiv.innerText = "Please select a file!";
        return;
    }

    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append("file", file);

    button.disabled = true;
    button.innerText = "Uploading...";

    try {
        // ✅ Pass user_id in URL (same pattern as chat API)
        const res = await fetch(`/api/add_file/${parseInt(userId)}`, {
            method: "POST",
            body: formData
        });

        const data = await res.json();
        responseDiv.style.display = "block";

        if (res.status === 200) {
            responseDiv.className = "response success";
            responseDiv.innerText =
                `${data.message}\nFile: ${data.file_name}`;
        } else {
            responseDiv.className = "response error";
            responseDiv.innerText = data.message;
        }

    } catch (err) {
        responseDiv.style.display = "block";
        responseDiv.className = "response error";
        responseDiv.innerText = "Server error.";
    }

    button.disabled = false;
    button.innerText = "Upload";
}

</script>

</body>
</html>
