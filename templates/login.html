<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
body { background:#343541; display:flex; justify-content:center; align-items:center; height:100vh;}
.chat-wrapper { width:100%; max-width:500px; background:#444654; border-radius:10px; overflow:hidden;}
.header { background:#202123; padding:16px; color:white; text-align:center;}
.form-container { padding:25px; display:flex; flex-direction:column;}
input { padding:14px; margin-bottom:15px; border-radius:8px; border:none; background:#565869; color:white;}
button { padding:14px; border-radius:8px; border:none; background:#19c37d; cursor:pointer;}
.secondary-btn { margin-top:10px; background:#565869; color:white;}
.response { margin-top:15px; padding:12px; border-radius:8px;}
.success { background:#19c37d; color:black;}
.error { background:#565869; color:white;}
</style>
</head>

<body>

<div class="chat-wrapper">
    <div class="header">Login</div>

    <div class="form-container">
        <input type="email" id="email" placeholder="Enter your email" />
        <input type="password" id="password" placeholder="Enter your password" />

        <button id="loginBtn" onclick="login()">Login</button>
        <button class="secondary-btn" onclick="window.location.href='/sign_up'">Create Account</button>

        <div id="response" class="response" style="display:none;"></div>
    </div>
</div>

<script>
async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const button = document.getElementById("loginBtn");
    const responseDiv = document.getElementById("response");

    if (!email || !password) {
        responseDiv.style.display = "block";
        responseDiv.className = "response error";
        responseDiv.innerText = "Email and password are required!";
        return;
    }

    button.disabled = true;
    button.innerText = "Logging in...";

    try {
        const res = await fetch("/api/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        responseDiv.style.display = "block";

        if (res.status === 200 && data.data?.is_login === true) {
            responseDiv.className = "response success";

            const userId = data.data.user_id;

            // ✅ Save session
            sessionStorage.setItem("user_id", userId);

            responseDiv.innerText = data.message;

            // ✅ Redirect
            setTimeout(() => {
                window.location.href = "/get_file";
            }, 1000);

        } else {
            responseDiv.className = "response error";
            responseDiv.innerText = data.message;
        }

    } catch (err) {
        responseDiv.style.display = "block";
        responseDiv.className = "response error";
        responseDiv.innerText = "Server error.";
    }

    button.disabled = false;
    button.innerText = "Login";
}
</script>

</body>
</html>
