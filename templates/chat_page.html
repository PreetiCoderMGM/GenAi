<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
    background: #343541;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.chat-wrapper {
    width: 100%;
    max-width: 900px;
    height: 95vh;
    background: #444654;
    display: flex;
    flex-direction: column;
    border-radius: 10px;
    overflow: hidden;
}

.header {
    background: #202123;
    padding: 16px;
    color: white;
    font-size: 18px;
    text-align: center;
    position: relative;
}

.back-btn {
    position: absolute;
    right: 15px;
    top: 12px;
    background: #19c37d;
    color: black;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    margin-bottom: 20px;
    display: flex;
}

.user-message {
    justify-content: flex-end;
}

.bot-message {
    justify-content: flex-start;
}

.bubble {
    max-width: 75%;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 15px;
    white-space: pre-wrap;
}

.user-message .bubble {
    background: #19c37d;
    color: black;
}

.bot-message .bubble {
    background: #565869;
    color: white;
}

.input-container {
    display: flex;
    padding: 15px;
    background: #40414f;
}

input {
    flex: 1;
    padding: 14px;
    border-radius: 8px;
    border: none;
    outline: none;
}

button {
    margin-left: 10px;
    padding: 14px 20px;
    border-radius: 8px;
    border: none;
    background: #19c37d;
    cursor: pointer;
}

.typing {
    font-style: italic;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="chat-wrapper">
    <div class="header">
        My AI Assistant (<span id="fileLabel"></span>)
        <button class="back-btn" onclick="goBack()">Back</button>
    </div>

    <div class="chat-container" id="chat"></div>

    <div class="input-container">
        <input type="text" id="question" placeholder="Ask something..." />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>

// ✅ Get session user_id (only for get_chat)
const userId = sessionStorage.getItem("user_id");

// ❌ Redirect if not logged in
if (!userId) {
    window.location.href = "/login";
}

// ✅ Get file_id from URL
const urlParams = new URLSearchParams(window.location.search);
const fileId = urlParams.get("file_id");

// ❌ If no file_id → redirect
if (!fileId) {
    window.location.href = "/get_file";
}

// Show file id in header
document.getElementById("fileLabel").innerText = "File ID: " + fileId;

const chat = document.getElementById("chat");

// ✅ Back function
function goBack() {
    window.location.href = "/get_file";
}

// ✅ Add message UI
function addMessage(text, type) {
    const messageDiv = document.createElement("div");
    messageDiv.className = `message ${type}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerText = text;

    messageDiv.appendChild(bubble);
    chat.appendChild(messageDiv);

    chat.scrollTop = chat.scrollHeight;
}

// ✅ Load chat history (user_id + file_id)
async function loadChatHistory() {
    try {
        const response = await fetch(`/api/get_chat/${userId}?file_id=${fileId}`);
        const result = await response.json();

        if (result.data && Array.isArray(result.data)) {
            const sorted = result.data.sort((a, b) =>
                new Date(a.ts) - new Date(b.ts)
            );

            sorted.forEach(item => {
                addMessage(item.question, "user-message");
                addMessage(item.answer, "bot-message");
            });
        }

    } catch (error) {
        console.error("Error loading chat:", error);
    }
}

// ✅ Send message (ONLY file_id)
async function sendMessage() {
    const input = document.getElementById("question");
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user-message");
    input.value = "";

    const typingBubble = document.createElement("div");
    typingBubble.className = "message bot-message";
    typingBubble.innerHTML = `<div class="bubble typing">Typing...</div>`;
    chat.appendChild(typingBubble);
    chat.scrollTop = chat.scrollHeight;

    try {
        const response = await fetch(`/api/ask_llm/${userId}?file_id=${fileId}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question })
        });

        const data = await response.json();
        typingBubble.remove();

        if (data.status === "success") {
            addMessage(data.answer, "bot-message");
        } else {
            addMessage("Error: " + data.message, "bot-message");
        }

    } catch (error) {
        typingBubble.remove();
        addMessage("Server error.", "bot-message");
    }
}

// Enter key support
document.getElementById("question")
.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

// 🚀 Load chat
window.onload = loadChatHistory;

</script>

</body>
</html>
