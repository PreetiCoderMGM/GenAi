<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
    background: #343541;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.chat-wrapper {
    width: 100%;
    max-width: 900px;
    height: 95vh;
    background: #444654;
    display: flex;
    flex-direction: column;
    border-radius: 10px;
    overflow: hidden;
}

.header {
    background: #202123;
    padding: 16px;
    color: white;
    font-size: 18px;
    text-align: center;
}

.chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    margin-bottom: 20px;
    display: flex;
}

.user-message {
    justify-content: flex-end;
}

.bot-message {
    justify-content: flex-start;
}

.bubble {
    max-width: 75%;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 15px;
    white-space: pre-wrap;
}

.user-message .bubble {
    background: #19c37d;
    color: black;
}

.bot-message .bubble {
    background: #565869;
    color: white;
}

.input-container {
    display: flex;
    padding: 15px;
    background: #40414f;
}

input {
    flex: 1;
    padding: 14px;
    border-radius: 8px;
    border: none;
    outline: none;
}

button {
    margin-left: 10px;
    padding: 14px 20px;
    border-radius: 8px;
    border: none;
    background: #19c37d;
    cursor: pointer;
}

.typing {
    font-style: italic;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="chat-wrapper">
    <div class="header">My AI Assistant</div>

    <div class="chat-container" id="chat"></div>

    <div class="input-container">
        <input type="text" id="question" placeholder="Ask something..." />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>

const chat = document.getElementById("chat");

// Add message to UI
function addMessage(text, type) {
    const messageDiv = document.createElement("div");
    messageDiv.className = `message ${type}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerText = text;

    messageDiv.appendChild(bubble);
    chat.appendChild(messageDiv);

    chat.scrollTop = chat.scrollHeight;
    return bubble;
}

// 🔥 Load previous chats
async function loadChatHistory() {
    try {
        const response = await fetch("http://127.0.0.1:5002/get_chat");
        const result = await response.json();

        if (result.data && Array.isArray(result.data)) {

            // Sort oldest -> newest (important for chat flow)
            const sorted = result.data.sort((a, b) =>
                new Date(a.ts) - new Date(b.ts)
            );

            sorted.forEach(item => {
                addMessage(item.question, "user-message");
                addMessage(item.answer, "bot-message");
            });
        }

    } catch (error) {
        console.error("Error loading chat:", error);
    }
}

// 🔥 Send new message
async function sendMessage() {
    const input = document.getElementById("question");
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user-message");
    input.value = "";

    const typingBubble = addMessage("Typing...", "bot-message");
    typingBubble.classList.add("typing");

    try {
        const response = await fetch("http://localhost:5002/ask_llm", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question })
        });

        const data = await response.json();

        typingBubble.classList.remove("typing");

        if (data.status === "success") {
            typingBubble.innerText = data.answer;
        } else {
            typingBubble.innerText = "Error: " + data.message;
        }

    } catch (error) {
        typingBubble.innerText = "Server error.";
    }
}

// Enter key support
document.getElementById("question")
.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

// 🚀 Load history on page load
window.onload = loadChatHistory;

</script>

</body>
</html>
